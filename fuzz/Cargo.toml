[package]
name = "cbor-static-fuzz"
description = "cargo-fuzz targets: every representative type, the Tokens walker, the differential oracles and the serde layer"
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[package.metadata]
cargo-fuzz = true

[package.metadata.seeds]
tokens = ["CBOR_TEST_VECTORS", "COSE_WG_VECTORS", "RFC_VECTORS", "SMP_VECTORS/os", "SMP_VECTORS/image", "fixtures"]
oracle = ["CBOR_TEST_VECTORS", "COSE_WG_VECTORS", "RFC_VECTORS", "SMP_VECTORS/os", "SMP_VECTORS/image", "fixtures"]
flat = ["fixtures/flat"]
rich = ["fixtures/rich"]
serde = ["fixtures"]
cose = ["COSE_WG_VECTORS", "RFC_VECTORS/rfc8392"]
edhoc = ["RFC_VECTORS/rfc9529"]
smp_os = ["SMP_VECTORS/os", "SMP_VECTORS/zephyr", "SMP_VECTORS/hand_built", "SMP_VECTORS/smp_only"]
smp_image = ["SMP_VECTORS/image"]

[dependencies]
libfuzzer-sys = "0.4"
cbor-static = { path = "../cbor-static", features = ["heapless", "alloc", "std", "serde"] }
cbor-static-conformance = { path = "../cbor-static-conformance" }
fuzz-fixtures = { path = "../target/harness/crates/fuzz-fixtures" }
ciborium = "=0.2.2"
minicbor = { version = "=2.3.1", default-features = false, features = ["alloc", "half"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_bytes = "=0.11.19"
serde_json = "1.0.154"

[workspace]
members = ["."]

[[bin]]
name = "tokens"
path = "fuzz_targets/tokens.rs"
test = false
doc = false
bench = false

[[bin]]
name = "oracle"
path = "fuzz_targets/oracle.rs"
test = false
doc = false
bench = false

[[bin]]
name = "flat"
path = "fuzz_targets/flat.rs"
test = false
doc = false
bench = false

[[bin]]
name = "rich"
path = "fuzz_targets/rich.rs"
test = false
doc = false
bench = false

[[bin]]
name = "serde"
path = "fuzz_targets/serde.rs"
test = false
doc = false
bench = false

[[bin]]
name = "cose"
path = "fuzz_targets/cose.rs"
test = false
doc = false
bench = false

[[bin]]
name = "edhoc"
path = "fuzz_targets/edhoc.rs"
test = false
doc = false
bench = false

[[bin]]
name = "smp_os"
path = "fuzz_targets/smp_os.rs"
test = false
doc = false
bench = false

[[bin]]
name = "smp_image"
path = "fuzz_targets/smp_image.rs"
test = false
doc = false
bench = false
