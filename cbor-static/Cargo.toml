[package]
name = "cbor-static"
description = "no_std, table-driven RFC 8949 CBOR: derives emit const descriptors walked by one iterative, resumable engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
alloc = ["serde_core?/alloc"]
embedded-io = ["dep:embedded-io"]
heapless = ["dep:heapless"]
nightly = []
serde = ["dep:serde_core"]
std = ["alloc", "serde_core?/std"]

[dependencies]
cbor-static-derive = { path = "../cbor-static-derive", version = "=0.0.0" }
embedded-io = { version = "0.7.1", optional = true, default-features = false }
heapless = { version = "0.9.3", optional = true, default-features = false }
serde_core = { version = "1.0.229", optional = true, default-features = false }

[dev-dependencies]
heapless = { version = "0.9.3", default-features = false, features = ["serde"] }
proc-macro2 = "1"
proptest = { version = "1", default-features = false, features = ["std"] }
quote = "1"
serde = { version = "1.0.229", features = ["derive"] }
serde_bytes = "0.11.19"
syn = { version = "2", features = ["full"] }
trybuild = "1"

[lints]
workspace = true
