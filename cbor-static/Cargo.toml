[package]
name = "cbor-static"
description = "no_std, table-driven RFC 8949 CBOR: derives emit const descriptors walked by one iterative, resumable engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
heapless = ["dep:heapless"]
nightly = []

[dependencies]
cbor-static-derive = { path = "../cbor-static-derive", version = "=0.0.0" }
heapless = { version = "0.9.3", optional = true, default-features = false }

[dev-dependencies]
proc-macro2 = "1"
proptest = { version = "1", default-features = false, features = ["std"] }
quote = "1"
syn = { version = "2", features = ["full"] }

[lints]
workspace = true
