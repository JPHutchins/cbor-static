name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      save-cache:
        description: Save this branch's Nix binary-cache entry (the cache's 10 GB cap evicts main's)
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  SCCACHE_GHA_ENABLED: "true"

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      miri: ${{ steps.matrix.outputs.miri }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - id: matrix
        run: |
          tasks=$(uv run --locked camas ci_jobs --github-matrix=tasks)
          shards=$(uv run --locked camas miri --github-matrix=axes)
          echo "matrix=$tasks" >> "$GITHUB_OUTPUT"
          echo "miri=$shards" >> "$GITHUB_OUTPUT"

  ci:
    needs: discover
    name: ${{ matrix.task }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    env:
      RUSTC_WRAPPER: ${{ !contains(fromJSON('["miri_doc", "kani"]'), matrix.task) && 'sccache' || '' }}
      SCCACHE_IDLE_TIMEOUT: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/nix
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.19.0
      - if: env.RUSTC_WRAPPER != ''
        run: sccache --start-server
      - &cargo-registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            target/cargo-home/registry/index
            target/cargo-home/registry/cache
            target/cargo-home/git/db
          key: cargo-registry-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-registry-
      - run: nix develop -c camas ${{ matrix.task }}

  miri:
    needs: discover
    name: miri ${{ matrix.SHARD }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.miri) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/nix
      - *cargo-registry
      - run: nix develop -c camas miri --matrix SHARD=${{ matrix.SHARD }}

  nix:
    needs: [ci, miri]
    if: ${{ !cancelled() && (github.event_name == 'push' || inputs.save-cache) }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: nix
        uses: ./.github/actions/nix
      - uses: ./.github/actions/nixcache-save
        with:
          roots: .#nixcache-roots
          cache-matched-key: ${{ steps.nix.outputs.cache-matched-key }}
