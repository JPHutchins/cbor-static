name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  SCCACHE_GHA_ENABLED: "true"

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - id: matrix
        run: echo "matrix=$(uv run --locked camas ci --github-matrix=tasks)" >> "$GITHUB_OUTPUT"

  ci:
    needs: discover
    name: ${{ matrix.task }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    env:
      RUSTC_WRAPPER: ${{ !contains(fromJSON('["miri", "kani"]'), matrix.task) && 'sccache' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - uses: ./.github/actions/nix
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            target/cargo-home/registry/index
            target/cargo-home/registry/cache
            target/cargo-home/git/db
          key: cargo-registry-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-registry-
      - if: matrix.task == 'kani'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            target/cargo-home/bin/cargo-kani
            target/cargo-home/bin/kani
            target/cargo-home/.crates.toml
            target/cargo-home/.crates2.json
            ~/.kani
            ~/.rustup/toolchains/nightly-*
          key: kani-${{ hashFiles('tasks.py') }}
      - run: nix develop -c camas ${{ matrix.task }}
