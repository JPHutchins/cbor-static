name: Daily

on:
  schedule:
    - cron: "0 10 * * *"
  workflow_dispatch:

concurrency:
  group: daily
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  SCCACHE_GHA_ENABLED: "true"

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - id: matrix
        run: |
          matrix=$(uv run --locked camas daily_jobs --github-matrix=tasks)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  daily:
    needs: discover
    name: ${{ matrix.task }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_IDLE_TIMEOUT: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/nix
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.19.0
      - run: sccache --start-server
      - uses: ./.github/actions/cargo-registry
      - run: nix develop -c camas ${{ matrix.task }}
      - if: ${{ !cancelled() }}
        env:
          TASK: ${{ matrix.task }}
        run: |
          mkdir -p "staged/$TASK"
          if [ -d target/daily ]; then cp -r target/daily/. "staged/$TASK/"; fi
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.task }}
          path: staged/
          if-no-files-found: ignore

  report:
    needs: [discover, daily]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: reports
          merge-multiple: true
      - id: verdict
        env:
          MATRIX: ${{ needs.discover.outputs.matrix || '{"task":[]}' }}
        run: |
          uv run --locked python -m harness.daily issue --matrix "$MATRIX" --reports reports \
            --repository-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" --run-id "$GITHUB_RUN_ID" --sha "$GITHUB_SHA" \
            --ref "$GITHUB_REF_NAME" \
            --body issue.md >> "$GITHUB_OUTPUT"
      - run: gh label create daily --force --color B60205 --description "The daily workflow's rolling failure report"
      - if: steps.verdict.outputs.verdict == 'failing'
        shell: bash
        env:
          TITLE: ${{ steps.verdict.outputs.title }}
        run: |
          number=$(gh api "repos/$GITHUB_REPOSITORY/issues?labels=daily&state=open" \
            --jq 'map(select(.pull_request == null)) | .[0].number // ""')
          if [ -n "$number" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/$number" -f title="$TITLE" -F body=@issue.md --jq .html_url
          else
            gh api "repos/$GITHUB_REPOSITORY/issues" -f title="$TITLE" -F body=@issue.md -f "labels[]=daily" --jq .html_url
          fi
      - if: steps.verdict.outputs.verdict == 'clean' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        shell: bash
        run: |
          numbers=$(gh api "repos/$GITHUB_REPOSITORY/issues?labels=daily&state=open" \
            --jq '.[] | select(.pull_request == null) | .number')
          for number in $numbers; do
            gh api "repos/$GITHUB_REPOSITORY/issues/$number/comments" \
              -f body="Closed by the clean run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID." --jq .html_url
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/$number" -f state=closed -f state_reason=completed --jq .html_url
          done
